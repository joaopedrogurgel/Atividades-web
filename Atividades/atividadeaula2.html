<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela de nomes</title>
</head>
<body>
    <div>
        <table border="1" width="100%">
            <tr>
                <td>Emily</td>
                <td>Jack</td>
                <td>Frank</td>
            </tr>
            <tr>
                <td>Mary</td>
                <td>Dominic</td>
                <td>Amy</td>
            </tr>
            <tr>
                <td>Thomas</td>
                <td>Angela</td>
                <td>David</td>
            </tr>
        </table>
    </div>
    <div>
        <table border="1" width="100%">
            <caption>Classic Movie Day</caption>
            <tr>
                <th></th>
                <th>5 pm</th>
                <th>7 pm</th>
                <th>9 pm</th>
                <th>11 pm</th>
            </tr>
            <br>
            <br>
            <br>
            <tr>
                <th>Screen one</th>
                <td>Star Wars</td>
                <td>Empire Strikes Back</td>
                <td>Return of the Jedi</td>
                <td>The Exorcist</td>
            </tr>
            <tr>
                <th>Screen two</th>
                <td colspan="2">Dances with Wolves</td>
                <td colspan="2">Gone With the Wind</td>
            </tr>
            <tr>
                <th>Screen three</th>
                <td colspan="2">2001: A Space Odyssey</td>
                <td>The Conversation</td>
                <td>5 Easy Pieces</td>
            </tr>
        </table>
    </div>
</body>
</html>
